[package]
name = "kernel-bot"
version = "1.0.0"
edition = "2021"

[dependencies]
anyhow = "1.0.66"
serenity = { version = "0.12.0", default-features = false, features = [
  "client",
  "gateway",
  "rustls_backend",
  "model",
] }
poise = "0.6.1"
tokio = { version = "1.26.0", features = ["full"] }
tracing = "0.1.37"
tracing-subscriber = "0.3"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "macros"] }
regex = "1.10"
rand = "0.8"
humantime = "2.1"
dotenvy = "0.15"
